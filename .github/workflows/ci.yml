name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Fixture accuracy evaluation
        run: pnpm --filter @repolens/core run eval
      - name: Analyze this repository with its own architecture rules
        run: pnpm analyze:self
      - uses: actions/upload-artifact@v4
        with:
          name: repolens-self-report
          path: repolens-report/
          retention-days: 14
