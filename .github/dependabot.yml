version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # The JS/TS analyzer uses the TypeScript compiler API, which TypeScript 7 (native port) does not provide.
      # Revisit when a stable programmatic API exists (see docs/PROJECT_STATE.md known risks).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # CI and the supported runtime are Node 22 (package.json engines), so types must stay on Node 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
